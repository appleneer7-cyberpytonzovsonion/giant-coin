<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giant Spinning Coin</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #2d2d2d, #111);
      font-family: Arial, sans-serif;
    }

    .coin {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fff9d6 0%, #f3d77d 22%, #d7a62d 48%, #a77016 100%);
      border: 16px solid #c98b12;
      box-shadow:
        0 25px 40px rgba(0,0,0,0.45),
        inset -18px -18px 20px rgba(0,0,0,0.15),
        inset 18px 18px 20px rgba(255,255,255,0.35);
      cursor: pointer;
      user-select: none;
      transform-style: preserve-3d;
      transition: transform 0.1s ease;
    }

    .coin::before,
    .coin::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .coin::before {
      background:
        radial-gradient(circle, transparent 0 56%, rgba(0,0,0,0.12) 56% 60%, transparent 60%),
        repeating-radial-gradient(circle, rgba(0,0,0,0.12), rgba(0,0,0,0.12) 4px, transparent 4px, transparent 12px);
      opacity: 0.7;
    }

    .coin::after {
      inset: 18px;
      border: 8px solid rgba(120, 76, 0, 0.45);
      border-radius: 50%;
    }

    .coin.spin {
      animation: spin-5-times 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes spin-5-times {
      0% {
        transform: rotateY(0deg) rotateX(0deg);
      }
      100% {
        transform: rotateY(1800deg) rotateX(720deg);
      }
    }

    .coin-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 54px;
      font-weight: 700;
      color: rgba(80, 55, 10, 0.8);
      text-shadow: 1px 1px 0 rgba(255,255,255,0.35);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="coin" id="coin" aria-label="Spinning coin" title="Click to spin">
    <div class="coin-label">€</div>
  </div>

  <script>
    const coin = document.getElementById("coin");

    coin.addEventListener("click", () => {
      coin.classList.remove("spin");
      void coin.offsetWidth; // force reflow so animation restarts
      coin.classList.add("spin");
    });
  </script>
</body>
</html>
